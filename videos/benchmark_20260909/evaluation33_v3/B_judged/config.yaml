evaluation:
  segment_duration: 10
  num_key_frames: 5
  vlm_frames_per_segment: 5
cache:
  metric_results:
    enabled: true
  vlm_frames:
    enabled: true
    cache_dir: /home/chendong/video-gen/LongLive-RAG/videos/benchmark_20260909/evaluation33_v3/cache_B_judged/vlm_frames
  languagebind:
    enabled: true
    cache_dir: /home/chendong/video-gen/LongLive-RAG/videos/benchmark_20260909/evaluation33_v3/cache_B_judged/languagebind
models:
  dino:
    model_name: dino_vitb16
    input_size: 224
  clip:
    model_name: ViT-B/32
  raft:
    model_name: raft
    iters: 20
    small: false
    mixed_precision: false
    alternate_corr: false
  languagebind:
    cache_dir: ./pretrained
  vtss:
    enabled: true
aggregation:
  llm_prompt_weighting:
    enabled: true
    service_name: planner
    cache_dir: /home/chendong/video-gen/LongLive-RAG/videos/benchmark_20260909/evaluation33_v3/cache_B_judged/prompt_weights
    fallback_strategy: mean
  metrics:
    subject_consistency:
      strategy: llm_prompt_weighted_mean
      cache_version: v2_local_p25_inter_medoid
      frame_positions:
      - 0.1
      - 0.3
      - 0.5
      - 0.7
      - 0.9
      intra_reduction: p25
      inter_reduction: p25
      local_weight: 0.34
      inter_weight: 0.66
      inter_adjacent_weight: 0.5
      inter_anchor_weight: 0.5
    background_consistency:
      strategy: llm_prompt_weighted_mean
      cache_version: v2_local_p25_inter_medoid
      frame_positions:
      - 0.1
      - 0.3
      - 0.5
      - 0.7
      - 0.9
      intra_reduction: p25
      inter_reduction: p25
      local_weight: 0.34
      inter_weight: 0.66
      inter_adjacent_weight: 0.5
      inter_anchor_weight: 0.5
    temporal_flickering:
      strategy: llm_prompt_weighted_mean
      raw_error_mode: raft_warped_luma
      frame_sample_count: 8
      fb_consistency_alpha: 0.01
      fb_consistency_beta: 0.5
      min_mask_ratio: 0.05
      mask_fallback: in_bounds
      pair_spatial_reduction: p90
      raw_error_reduction: p84
      score_mapping: exp
      tau: 0.5
    motion_smoothness:
      strategy: llm_prompt_weighted_mean
      score_mapping: exp
      tau: 3.0
    vtss:
      strategy: llm_prompt_weighted_mean
      score_mapping: anchored_linear
      raw_low: 0.02
      raw_high: 0.075
    boundary_smoothness:
      strategy: llm_prompt_transition_weighted_mean
      cache_version: single_level_relative_match_v1
      fallback_strategy: mean
      window_size: 2
      flow_tolerance_abs: 0.02
      flow_tolerance_rel: 0.5
    conditional_adjacent:
      strategy: llm_prompt_transition_weighted_mean
      fallback_strategy: mean
      similarity_mapping: affine_power
      similarity_floor: 0.79
      similarity_power: 2.0
      cache_version: v3_affine_power_raw
      cache_dir: /home/chendong/video-gen/LongLive-RAG/videos/benchmark_20260909/evaluation33_v3/cache_B_judged/conditional_adjacent
    conditional_longrange:
      entity_strategy: llm_prompt_target_weighted_mean
      sample_strategy: llm_prompt_coverage_weighted_mean
      fallback_entity_strategy: reverse_weighted
      fallback_sample_strategy: mean
      similarity_mapping: affine_power
      similarity_floor: 0.58
      similarity_power: 1.5
      target_weight_alpha: 0.7
      sample_weight_alpha: 0.0
      sample_weight_transform: identity
      cache_version: v4_affine_power_weightshrink_raw
      cache_dir: /home/chendong/video-gen/LongLive-RAG/videos/benchmark_20260909/evaluation33_v3/cache_B_judged/conditional_longrange
    entity_grounding:
      strategy: llm_prompt_weighted_mean
      cache_version: v5_eg_entity_main
      llm_service_name: planner
      cache_dir: /home/chendong/video-gen/LongLive-RAG/videos/benchmark_20260909/evaluation33_v3/cache_B_judged/entity_grounding
      max_entities: 4
      max_attributes_per_entity: 5
      fallback_score: 0.5
      empty_entity_score: 0.5
    dynamic_trajectory:
      strategy: direct
      cache_version: transition_selectivity_v1_raw
      center: 0.25
      temp: 0.05
      tau_on: 0.02
      tau_off: 0.06
    vlm_score:
      strategy: direct
      segment_weight: 0.8
      overall_weight: 0.2
      fallback_score: 0.5
services:
  mllm:
    provider: openai
    base_url: http://127.0.0.1:37029/v1
    api_key: EMPTY
    model: Qwen/Qwen3-VL-8B-Instruct
    temperature: 0.0
    max_tokens: 256
  vlm:
    provider: openai
    base_url: http://127.0.0.1:37029/v1
    api_key: EMPTY
    model: Qwen/Qwen3-VL-8B-Instruct
    temperature: 0.0
    max_tokens: 256
  planner:
    provider: openai
    base_url: http://127.0.0.1:37029/v1
    api_key: EMPTY
    model: Qwen/Qwen3-VL-8B-Instruct
    temperature: 0.0
    max_tokens: 256
weights:
  quality: 1.0
  temporal: 1.0
  instruction: 1.0
