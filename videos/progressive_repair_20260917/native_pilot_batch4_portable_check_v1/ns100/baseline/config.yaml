    They both remain focused, their postures a mix of seated and slightly leaned in.
- seconds: 10
  prompts:
  - Noah sits back in his seat at the lecture hall front row, reflecting on the interaction
    with Iris. He taps the notebook, still focused on the diagram they discussed.
    The bright overhead lighting casts a soft glow on the wooden seats around him.
- seconds: 10
  prompts:
  - Noah stands up at the lecture hall front row, carefully placing the notebook back
    on the table. He adjusts the diagram to its earlier position, ensuring everything
    is neat and organized. The bright overhead lighting continues to illuminate the
    wooden seats.
- seconds: 10
  prompts:
  - Noah settles the notebook in its final place at the lecture hall front row. He
