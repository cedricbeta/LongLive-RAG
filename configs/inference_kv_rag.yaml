# KV-RAG inference example for Wan2.2-TI2V-5B.
# Copy checkpoint/data paths from configs/inference.yaml or your local yaml.

model_kwargs:
  model_name: Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32

use_ema: false
output_folder: videos/longlive2_kv_rag
num_samples: 1
save_latents_only: false

data:
  data_path: /path/to/longlive2/inference_prompts
  image_or_video_shape:
  - 1
  - 128
  - 48
  - 44
  - 80

inference:
  sampling_steps: 4
  sink_size: 8
  # Cross-perspective protocol: render ONE video per prompt/perspective (instead
  # of one concatenated multi-shot video per scene) so the persistent KV-RAG
  # scene memory carries across a scene's perspectives. Default off reproduces
  # the concatenated multi-shot behavior. Evaluate with
  # `scripts/evaluate_kv_rag.py --mode multiview_vbench` (VBench DINO/CLIP).
  multiview_per_perspective: false
  guidance_scale: 1.0
  multi_shot_sink: true
  multi_shot_rope_offset: 8
  streaming_vae: false
  async_vae: false
  vae_type: wan
  vae_device: "cuda:2"

  kv_rag:
    enabled: true
    # Store/retrieve only selected layers to bound memory. Use "all" for every layer.
    layers: [0, 7, 14, 21, 29]
    top_k: 2
    max_entries: 32
    max_tokens_per_entry: 1024
    min_frame_gap: 0
    retrieve_during_denoise: true
    retrieve_during_recache: false
    store_after_recache: true
    token_policy: uniform
    similarity: cosine
    store_on_cpu: false
    verbose: true
    # --- retrieval-signal fixes (default on) ---
    # Match on pre-RoPE content (position-invariant) and keep per-head structure.
    summary_prerope: true
    summary_per_head: true
    # --- in-distribution injection (default on) ---
    # Re-RoPE retrieved keys into a virtual frame block just before the local
    # window. frame_aligned_store keeps whole frames so the slice can be re-RoPE'd.
    # Set both false to reproduce the legacy stale-absolute-RoPE injection path.
    reinject_rope: true
    frame_aligned_store: true
    # --- single-scene multi-perspective consistency (default off) ---
    # Persistent "scene" partition that survives shot boundaries so different
    # camera angles of one environment stay coherent. Defaults below are off, so
    # this config behaves exactly like plain KV-RAG until you opt in. For the
    # multi-view prompts in example/multiview_prompts/, enable all four:
    #   scene_memory_enabled: true
    #   boundary_inject_anchors: 2     # force-inject scene anchors at each cut
    #   scene_score_bonus: 0.1         # prefer the shared scene during matching
    #   retrieval_key_mode: salient_set  # recommended viewpoint-robust key
    scene_memory_enabled: false
    scene_memory_max_entries: 8
    scene_score_bonus: 0.0
    boundary_inject_anchors: 0
    # --- decoupled retrieval key/value representations ---
    # key in {pooled [baseline], moment, multi_centroid, salient_set, positional};
    # value in {raw [baseline], mean_frame}. Defaults reproduce the baseline.
    # See docs/retrieval-key-value-study.md for the comparison and selection.
    retrieval_key_mode: pooled
    retrieval_key_centroids: 4
    retrieval_key_top_m: 8
    retrieval_value_mode: raw

checkpoints:
  generator_ckpt: /path/to/longlive2/generator_checkpoint.pt
  lora_ckpt: /path/to/longlive2/lora_checkpoint.pt

adapter:
  type: lora
  rank: 128
  alpha: 128
  dropout: 0.0
  verbose: true

logging:
  seed: 0
