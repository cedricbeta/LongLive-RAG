model_kwargs:
  model_name: Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32
use_ema: false
output_folder: videos/longlive2_kv_rag
num_samples: 1
save_latents_only: false
data:
  data_path: /path/to/longlive2/inference_prompts
  image_or_video_shape:
  - 1
  - 128
  - 48
  - 44
  - 80
inference:
  sampling_steps: 4
  sink_size: 8
  multiview_per_perspective: false
  guidance_scale: 1.0
  multi_shot_sink: true
  multi_shot_rope_offset: 8
  streaming_vae: false
  async_vae: false
  vae_type: wan
  vae_device: cuda:2
  kv_rag:
    enabled: true
    layers:
    - 0
    - 7
    - 14
    - 21
    - 29
    top_k: 2
    max_entries: 32
    max_tokens_per_entry: 1024
    min_frame_gap: 0
    retrieve_during_denoise: true
    retrieve_during_recache: false
    store_after_recache: true
    token_policy: uniform
    similarity: cosine
    store_on_cpu: false
    verbose: true
    summary_prerope: true
    summary_per_head: true
    reinject_rope: true
    frame_aligned_store: true
    scene_memory_enabled: false
    scene_memory_max_entries: 8
    scene_score_bonus: 0.0
    boundary_inject_anchors: 0
    retrieval_key_mode: pooled
    retrieval_key_centroids: 4
    retrieval_key_top_m: 8
    retrieval_value_mode: raw
checkpoints:
  generator_ckpt: /path/to/longlive2/generator_checkpoint.pt
  lora_ckpt: /path/to/longlive2/lora_checkpoint.pt
adapter:
  type: lora
  rank: 128
  alpha: 128
  dropout: 0.0
  verbose: true
logging:
  seed: 0
num_output_frames: 48
