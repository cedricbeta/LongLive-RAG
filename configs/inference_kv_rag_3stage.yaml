# KV-RAG three-stage validation config for Wan2.2-TI2V-5B.
# Fill in checkpoint paths before running.

model_kwargs:
  model_name: Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32

use_ema: false
output_folder: videos/kv_rag_3stage_humans
num_samples: 1
save_latents_only: false

data:
  data_path: example/kv_rag_3stage_prompts
  # 144 latent frames / 8 frames per block = 18 prompt chunks.
  # The example shot_durations.txt files split those chunks as 6 / 6 / 6.
  image_or_video_shape:
  - 1
  - 144
  - 48
  - 44
  - 80

inference:
  sampling_steps: 4
  sink_size: 8
  guidance_scale: 1.0
  # Smooth-turn validation should be one continuous shot, not scene cuts.
  scene_cut_prefix: ""
  multi_shot_sink: false
  multi_shot_rope_offset: 0
  streaming_vae: false
  async_vae: false
  vae_type: wan
  vae_device: "cuda:2"
  output_folder: videos/kv_rag_3stage_humans
  filename_from_sample_name: true

  kv_rag:
    enabled: true
    layers: [0, 7, 14, 21, 29]
    top_k: 2
    max_entries: 32
    max_tokens_per_entry: 1024
    min_frame_gap: 0
    retrieve_during_denoise: true
    retrieve_during_recache: false
    store_after_recache: true
    token_policy: uniform
    similarity: cosine
    store_on_cpu: false
    verbose: true
    # Retrieval-signal + injection fixes (default on). Set reinject_rope and
    # frame_aligned_store false to reproduce the legacy injection path.
    summary_prerope: true
    summary_per_head: true
    reinject_rope: true
    frame_aligned_store: true

checkpoints:
  # Replace with your local merged/full generator checkpoint, or pass
  # --generator_ckpt to scripts/run_kv_rag_ablation.py.
  generator_ckpt: checkpoints/longlive2_5b/longlive2_merged_generator.pt

# If you need an unmerged LoRA adapter, add checkpoints.lora_ckpt and an
# adapter section matching your LoRA. The default example assumes a merged
# generator checkpoint.

logging:
  seed: 0
