# Local BF16 quickstart config for LongLive 2.0 5B.
# Expected model files:
#   checkpoints/longlive2_5b/longlive2_merged_generator.pt
#   wan_models/Wan2.2-TI2V-5B/models_t5_umt5-xxl-enc-bf16.pth
#   wan_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
#   wan_models/Wan2.2-TI2V-5B/google/umt5-xxl/

model_kwargs:
  model_name: Wan2.2-TI2V-5B
  timestep_shift: 5.0
  num_frame_per_block: 8
  local_attn_size: 32

use_ema: false
output_folder: videos/longlive2-5b-bf16
num_samples: 1
save_latents_only: false

data:
  data_path: example/longlive2_5b_prompts.txt
  image_or_video_shape:
  - 1
  - 128
  - 48
  - 44
  - 80

inference:
  sampling_steps: 4
  sink_size: 8
  guidance_scale: 1.0
  multi_shot_sink: true
  multi_shot_rope_offset: 8
  streaming_vae: false
  async_vae: false
  vae_type: wan
  vae_device: "cuda:0"

checkpoints:
  generator_ckpt: checkpoints/longlive2_5b/longlive2_merged_generator.pt

logging:
  seed: 0
